<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Police Control Room</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0b1220; --card:#111c2e; --line:#22314a; --text:#e2e8f0; --muted:#8aa0bd; --red:#ef4444; --amber:#f59e0b; --green:#22c55e; --blue:#3b82f6; }
  * { box-sizing:border-box; } body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); gap:12px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; } header small { color:var(--muted); }
  button, select, input { font:inherit; } button { background:var(--blue); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  input, select { background:#08101d; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  #login { max-width:360px; margin:12vh auto; background:var(--card); padding:24px; border-radius:12px; display:flex; flex-direction:column; gap:10px; }
  #app { display:none; grid-template-columns:minmax(320px,420px) minmax(0,1fr); height:calc(100vh - 58px); }
  @media (max-width: 900px) { #app { grid-template-columns:1fr; height:auto; } }
  #listPane { border-right:1px solid var(--line); overflow-y:auto; }
  .filters { display:flex; gap:6px; padding:10px; position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .filters input { flex:1; min-width:140px; }
  .row { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; } .row:hover, .row.sel { background:#14233a; }
  .row b { font-family:ui-monospace,Consolas,monospace; } .meta { color:var(--muted); font-size:12px; margin-top:3px; }
  .pill { display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px; background:#22314a; margin-left:6px; }
  .CRITICAL { background:#7f1d1d; } .HIGH { background:#78350f; } .live { background:#14532d; }
  #detail { overflow-y:auto; padding:16px; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px; }
  .kv { background:var(--card); border-radius:8px; padding:8px 10px; } .kv span { display:block; color:var(--muted); font-size:11px; }
  h3 { margin:18px 0 8px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  #map { height:300px; border-radius:10px; margin-top:12px; background:var(--card); }
  .tline { font-size:13px; padding:6px 8px; border-left:3px solid var(--line); margin-bottom:4px; background:var(--card); }
  .tline.CALLER { border-color:var(--blue); } .tline.SYSTEM { border-color:var(--green); }
  table { width:100%; border-collapse:collapse; font-size:12px; } td { border-bottom:1px solid var(--line); padding:4px 6px; vertical-align:top; }
  .muted { color:var(--muted); } .err { color:var(--red); }
</style>
</head>
<body>
<header>
  <div><h1>🚓 Police Control Room — Sabarimala Emergency Response</h1><small>Every access to call records is logged (user, time, address).</small></div>
  <div id="who" class="muted"></div>
</header>
<form id="login">
  <h2 style="margin:0">Officer sign-in</h2>
  <input id="email" type="email" placeholder="Official e-mail" autocomplete="username" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div id="loginErr" class="err"></div>
  <small class="muted">Authorised Kerala Police personnel only. Accounts are issued by the system administrator.</small>
</form>
<div id="app">
  <section id="listPane">
    <div class="filters">
      <input id="q" placeholder="Case no., phone, place…">
      <select id="scope"><option value="active">Live calls</option><option value="all">All calls</option></select>
      <button id="logout" class="ghost" type="button">Sign out</button>
    </div>
    <div id="list"></div>
  </section>
  <section id="detail"><p class="muted">Select a call to see its full record.</p></section>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/police.js"></script>
</body>
</html>
